plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    // The Flutter Gradle Plugin applies Kotlin itself while android.builtInKotlin=false
    // (Flutter 3.50 template); applying it here is deprecated under AGP 9.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.giaohang247"
    // permission_handler 13 (via sli_common) compiles against API 37; Flutter
    // 3.50 defaults to 36. Drop back to flutter.compileSdkVersion once it is 37.
    compileSdk 37
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AGP 9 turns resValues off by default; the flavors below set app_name with it.
    buildFeatures {
        resValues = true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    flavorDimensions "app"
    productFlavors {
        dev {
            dimension "app"
//            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Giaohang247 Dev"
//            versionNameSuffix ".dev"
        }

        staging {
            dimension "app"
//            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Giaohang247 Staging"
//            versionNameSuffix ".dev"
        }

        prod {
            dimension "app"
//            applicationIdSuffix ".prod"
            resValue "string", "app_name", "Giaohang247"
//            versionNameSuffix ".prod"
        }
    }


    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.giaohang247"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}
